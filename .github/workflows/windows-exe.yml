name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - apps/api/**
      - apps/web/**
      - .github/workflows/windows-exe.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Sentry Electron (Windows only)
        run: npm install @sentry/electron@8.4.0 -w @inboxflow/desktop --no-save

      - name: Build API + web and stage hybrid resources
        run: npm run desktop:prepare

      - name: Portable Node for Windows
        run: npm run desktop:node:win

      - name: Build NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Verify hybrid package
        run: node apps/desktop/scripts/verify-installer.mjs

      - name: Icon, silent install, launch
        shell: pwsh
        run: ./apps/desktop/scripts/windows-smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: InboxFlow-Setup-1.2.45
          path: |
            apps/desktop/release/InboxFlow-Setup-*.exe
            apps/desktop/release/InboxFlow-Setup-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-1.2.45
          name: Inbox Flow desktop 1.2.45
          body: |
            Windows installer built and smoke-tested on GitHub `windows-latest`.
            Local hybrid mailer (SQLite + bundled API). Auth/license against Lightsail.
            Open, click, and unsubscribe links use https://novasreach.xyz. No port 5000.
            A person lands on a confirm page first. Unsubscribe happens only after they use the underlined link. Mailbox one-click still unsubscribes immediately.
            Every letter also gets Inbox Flow's own signed unsubscribe link. DNS records verify on their own once they propagate.
            The PC pulls those events back into the local campaign.
            Removing a From address updates the SMTP profile title. The removed address does not stay in the name.
            A campaign send signs open and unsubscribe links with the signed-in session, then uses the same SMTP path as Placement test. A send that cannot sign those links pauses instead of sitting at 0 sent.
            The SMTP session stays open across recipients, so the fast pace is not spent logging in again for every address.
            Campaign sends do not wait between messages unless the campaign's pause, gap, or per-minute cap says so. Up to four go out at once on that open session.
            The campaign screen shows Sending or Batch pause with the seconds left. Those seconds can be changed while the send is running. The next email uses the new numbers. 0 means no wait.
            The screen turning off does not pause a send. The desktop keeps the sign-in and refreshes it itself. A failed signing call is retried and the list stays Sending.
            One rejected address is marked failed. The campaign does not pause itself. Only the Pause button stops it. Resume stays on Sending.
            Opens and clicks show on the campaign log while the send is still running, the same numbers as the campaign list.
            The minute cap waits once for the time left in that minute. It does not restart a 5 second countdown before the next email.
            The campaign log lists everyone who opened or clicked, the same table as Results, while the send is still going.
            A letter accepts any lead tag, such as company or city, when that column is on the list. A file added in the editor is a real attachment the mailbox shows as a download.
            The Attachments tab sends any file or audio clip as a mailbox download. Tick a file to include it. Up to 10 files, 10 MB each, 25 MB together. An MP3, WAV, or M4A stays audio when the computer leaves the type blank.
            Logs is an email console: number, SMTP, from, to, subject, and SENT or FAILED. The send rows fill the Logs tab. Opens and clicks stay in a short list under that table.
            Clicking a letter card turns that card green and opens it to edit. The tick only chooses which letters go out.
            The send log is one line per address, [time] SENT address - sent successfully. Scrolling up stays there. New lines follow only when you are at the bottom.
            The signed-in account shows how many days are left on the license. The admin user list shows the same days left for each customer.
            A letter is selected with its tick. Clearing the HTML source clears the preview.
            Preview steps through each person, fills their tags, and can send that one copy. A letter with no tags still sends as the imported HTML, including one-per-line spin.
            Installing over an older EXE keeps `%APPDATA%\Inbox Flow`.
            Created users must Bind PC in the browser on the admin bind URL first.
            Unbound EXE shows only: PC not bound yet. Never opens novasreach.xyz.
            Zip includes `config.json` next to InboxFlow.exe (`username` + `license_key`).
          files: |
            apps/desktop/release/InboxFlow-Setup-1.2.45.exe
            apps/desktop/release/InboxFlow-Setup-1.2.45.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
