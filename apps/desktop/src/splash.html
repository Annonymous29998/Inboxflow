<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox Flow</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #d7e0d7;
        font-family: "Segoe UI", Consolas, ui-monospace, monospace;
        overflow: hidden;
        user-select: none;
      }
      .wrap {
        box-sizing: border-box;
        height: 100%;
        padding: 28px 32px 24px;
        display: flex;
        flex-direction: column;
        border: 1px solid #1f2a1f;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 52px;
        height: 52px;
        object-fit: contain;
        border: 1px solid #2a3d2a;
        background: #070a0c;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7cff9a;
      }
      .sub {
        margin: 4px 0 0;
        font-size: 12px;
        color: #9bb09b;
      }
      .stage {
        margin: 28px 0 10px;
        font-size: 18px;
        color: #e8ffe8;
      }
      .line {
        min-height: 18px;
        font-size: 12px;
        color: #9bb09b;
      }
      .bar {
        margin-top: 16px;
        height: 6px;
        background: #122016;
        border: 1px solid #2a3d2a;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 8%;
        background: #7cff9a;
        box-shadow: 0 0 12px rgba(124, 255, 154, 0.45);
        transition: width 0.35s ease;
      }
      .foot {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #6d856d;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img class="mark" src="icon.png" alt="Inbox Flow" />
        <div>
          <h1>Inbox Flow</h1>
          <p class="sub" id="sub">inboxflow.io · desktop host</p>
        </div>
      </div>
      <p class="stage" id="stage">Installing Inbox Flow</p>
      <p class="line" id="line">Preparing this PC…</p>
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="foot">
        <span id="pct">0%</span>
        <span>localhost:5000 opens when ready</span>
      </div>
    </div>
    <script>
      const first = new URLSearchParams(location.search).get("first") === "1";
      const stage = document.getElementById("stage");
      const line = document.getElementById("line");
      const fill = document.getElementById("fill");
      const pctEl = document.getElementById("pct");
      stage.textContent = first ? "Installing Inbox Flow" : "Starting Inbox Flow";

      function apply(payload) {
        if (!payload) return;
        if (payload.stage) stage.textContent = payload.stage;
        if (payload.line) line.textContent = payload.line;
        const pct = Math.max(0, Math.min(100, Number(payload.pct) || 0));
        fill.style.width = pct + "%";
        pctEl.textContent = Math.round(pct) + "%";
      }

      if (window.inboxflowDesktop && window.inboxflowDesktop.onSplash) {
        window.inboxflowDesktop.onSplash(apply);
      }
    </script>
  </body>
</html>
